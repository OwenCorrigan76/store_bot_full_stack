version: "3.8"

services:
  # vLLM Inference Server with Llama model
  vllm:
    image: vllm/vllm-openai:latest
    container_name: guitar-vllm
    ports:
      - "8000:8000"
    environment:
      - MODEL_NAME=meta-llama/Llama-2-7b-hf
      - GPU_MEMORY_UTILIZATION=0.9
      - CUDA_VISIBLE_DEVICES=0
    # Uncomment for GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: python -m vllm.entrypoints.openai.api_server --model meta-llama/Llama-2-7b-hf --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - guitar-net

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: guitar-backend
    ports:
      - "8001:8001"
    depends_on:
      vllm:
        condition: service_healthy
    environment:
      - VLLM_BASE_URL=http://vllm:8000
      - DEBUG=true
      - LOG_LEVEL=INFO
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - guitar-net

  # React Frontend (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: guitar-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8001
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - /app/node_modules
    command: npm run dev
    networks:
      - guitar-net

networks:
  guitar-net:
    driver: bridge
